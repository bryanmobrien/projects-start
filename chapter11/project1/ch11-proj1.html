<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chapter 11</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.2/css/bulma.min.css">

    <link rel="stylesheet" href="ch11-proj1.css" />

    <!--The React JS libraries -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <!--Initially, we will use the babel run-time library to convert JSX in the browser -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>   
    
    <script src="movie-data.js"></script>
    
<script type="text/babel">

class App extends React.Component {
    constructor(props) {
        super(props);
        this.state = {
            movies: movieData
        };
    }

    saveChanges = (updatedMovie, index) => {
        const movies = [...this.state.movies];
        movies[index] = updatedMovie;
        this.setState({ movies });
    };

    render() {
        return (
            <main className="container">
                <section className="columns has-background-light">

                    <MovieList movies={this.state.movies} />

                    <div className="column is-half">
                        {this.state.movies.map((m, index) =>
                            <MovieForm
                                key={m.id}
                                index={index}
                                movie={m}
                                saveChanges={this.saveChanges}
                            />
                        )}
                    </div>

                </section>
            </main>
        );
    }
}
  
class MovieList extends React.Component {
    render() {
        return (
            <div className="column is-half">
                <ul className="columns is-multiline">
                    {this.props.movies.map(movie =>
                        <SingleMovie key={movie.id} movie={movie} />
                    )}
                </ul>
            </div>
        );
    }
}

class SingleMovie extends React.Component {
    render() {
        const m = this.props.movie;

        return (
            <li className="column is-one-third-desktop is-half-tablet">
                <div className="card">
                    <div className="card-image">
                        <figure className="image is-2by3">
                            <img
                                src={"https://image.tmdb.org/t/p/w185" + m.poster}
                                alt={m.title}
                            />
                        </figure>
                    </div>

                    <div className="card-content has-text-centered content-rectangle">
                        <h2 className="title is-6">
                            {m.title} ({m.runtime} min)
                        </h2>
                        <p className="is-size-7">{m.tagline}</p>
                    </div>

                    <footer className="card-footer">
                        <MovieLink id={m.tmdbID} />
                    </footer>
                </div>
            </li>
        );
    }
}

const MovieLink = props => {
    return (
        <a
            className="button card-footer-item"
            href={"https://www.themoviedb.org/movie/" + props.id}
        >
            <img src="images/tmdb.svg" width="30" />
        </a>
    );
};

class MovieForm extends React.Component {
    constructor(props) {
        super(props);

        this.state = {
            title: props.movie.title,
            tagline: props.movie.tagline,
            runtime: props.movie.runtime
        };
    }

    handleChange = (e) => {
        this.setState({ [e.target.name]: e.target.value }, () => {
            this.props.saveChanges(
                {
                    ...this.props.movie,
                    ...this.state
                },
                this.props.index
            );
        });
    };

    render() {
        return (
            <form className="panel has-background-grey-lighter">

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Title</label>
                    </div>
                    <div className="field-body">
                        <input
                            className="input"
                            type="text"
                            name="title"
                            value={this.state.title}
                            onChange={this.handleChange}
                        />
                    </div>
                </div>

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Tagline</label>
                    </div>
                    <div className="field-body">
                        <textarea
                            className="textarea"
                            rows="2"
                            name="tagline"
                            value={this.state.tagline}
                            onChange={this.handleChange}
                        />
                    </div>
                </div>

                <div className="field is-horizontal">
                    <div className="field-label is-normal">
                        <label className="label">Runtime</label>
                    </div>
                    <div className="field-body">
                        <input
                            className="input"
                            type="text"
                            name="runtime"
                            value={this.state.runtime}
                            onChange={this.handleChange}
                        />
                    </div>
                </div>

            </form>
        );
    }
}

ReactDOM.render(<App />, document.querySelector('#react-container'));

</script> 
        
        
  </head>
  <body>
    <div id='react-container' ></div>
  </body>
</html>
